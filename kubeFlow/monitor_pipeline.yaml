# PIPELINE DEFINITION
# Name: mlops-monitoring-pipeline
# Description: Evaluate latest registered model on new labeled data and trigger retraining if degraded
# Inputs:
#    bucket_name: str
#    env: str
#    f1_threshold: float
#    feature_set: str
#    location: str
#    project_id: str
#    recipient_email: str
#    sender_email: str
#    smtp_secret_name: str
#    trigger_id: str
components:
  comp-condition-1:
    dag:
      tasks:
        trigger-new-run-op:
          cachingOptions: {}
          componentRef:
            name: comp-trigger-new-run-op
          inputs:
            parameters:
              f1_score:
                componentInputParameter: pipelinechannel--evaluate-data-op-f1_score
              location:
                componentInputParameter: pipelinechannel--location
              project_id:
                componentInputParameter: pipelinechannel--project_id
              trigger_id:
                componentInputParameter: pipelinechannel--trigger_id
          taskInfo:
            name: trigger-new-run-op
    inputDefinitions:
      parameters:
        pipelinechannel--evaluate-data-op-f1_score:
          parameterType: NUMBER_DOUBLE
        pipelinechannel--evaluate-data-op-retrain_decision:
          parameterType: STRING
        pipelinechannel--location:
          parameterType: STRING
        pipelinechannel--project_id:
          parameterType: STRING
        pipelinechannel--trigger_id:
          parameterType: STRING
  comp-evaluate-data-op:
    executorLabel: exec-evaluate-data-op
    inputDefinitions:
      artifacts:
        prepared_data:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
      parameters:
        bucket_name:
          parameterType: STRING
        env:
          parameterType: STRING
        f1_threshold:
          parameterType: NUMBER_DOUBLE
        feature_set:
          parameterType: STRING
        project_id:
          parameterType: STRING
        recipient_email:
          parameterType: STRING
        sender_email:
          parameterType: STRING
        smtp_secret_name:
          parameterType: STRING
    outputDefinitions:
      parameters:
        f1_score:
          parameterType: NUMBER_DOUBLE
        retrain_decision:
          parameterType: STRING
  comp-extract-data-op:
    executorLabel: exec-extract-data-op
    inputDefinitions:
      parameters:
        bucket_name:
          parameterType: STRING
    outputDefinitions:
      artifacts:
        raw_data:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
  comp-prepare-data-op:
    executorLabel: exec-prepare-data-op
    inputDefinitions:
      artifacts:
        raw_data:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
    outputDefinitions:
      artifacts:
        prepared_data:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
  comp-trigger-new-run-op:
    executorLabel: exec-trigger-new-run-op
    inputDefinitions:
      parameters:
        f1_score:
          parameterType: NUMBER_DOUBLE
        location:
          parameterType: STRING
        project_id:
          parameterType: STRING
        trigger_id:
          parameterType: STRING
deploymentSpec:
  executors:
    exec-evaluate-data-op:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - evaluate_data_op
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.7.0'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef evaluate_data_op(\n    bucket_name: str,\n    env: str,\n   \
          \ prepared_data: Input[Dataset],\n    feature_set: str,\n    f1_threshold:\
          \ float,\n    sender_email: str,recipient_email: str,\n    project_id: str,smtp_secret_name:\
          \ str,\n) -> NamedTuple(\"Outputs\", [(\"retrain_decision\", str), (\"f1_score\"\
          , float)]):\n\n    import os\n    import joblib\n    import pandas as pd\n\
          \    from google.cloud import storage, secretmanager\n    from sklearn.model_selection\
          \ import train_test_split\n    from sklearn.metrics import f1_score\n  \
          \  import smtplib\n    from email.mime.text import MIMEText\n\n    # Initialize\
          \ GCS client\n    client = storage.Client()\n    path = \"/tmp/model.joblib\"\
          \n    client.bucket(bucket_name).blob(f\"artifacts/{env}/latest/model.joblib\"\
          ).download_to_filename(path)\n\n    # Load the trained model from the downloaded\
          \ file\n    model = joblib.load(path)\n\n    # Parse the selected feature\
          \ columns\n    features = [c.strip() for c in feature_set.split(\",\")]\n\
          \    df = pd.read_csv(os.path.join(prepared_data.path, \"prepared_data.csv\"\
          ),usecols=features)\n\n    X_test = df.drop(columns=[\"breaks\"], axis=1)\n\
          \    y_test = df[\"breaks\"]\n\n    y_pred = model.predict(X_test)\n\n \
          \   y_test_binary = (y_test != 0).astype(int)\n    y_pred_binary = (y_pred\
          \ != 0).astype(int)\n\n    f1 = f1_score(y_test_binary, y_pred_binary, average=\"\
          binary\")\n\n    if f1 < f1_threshold:\n        sm_client = secretmanager.SecretManagerServiceClient()\n\
          \        secret_path = (f\"projects/{project_id}/secrets/{smtp_secret_name}/versions/latest\"\
          )\n        response = sm_client.access_secret_version(request={\"name\"\
          : secret_path})\n        sender_password = response.payload.data.decode(\"\
          UTF-8\")\n        subject = f\"[ALERT] Monitoring Pipeline Failed - {env}\"\
          \n        body = f\"\"\"\n        F1 score dropped below threshold. Retraining\
          \ has been triggered.<br><br>\n        <b>Environment:</b> {env}<br>\n \
          \       <b>F1:</b> {f1:.4f}<br>\n        <b>Threshold:</b> {f1_threshold:.4f}\n\
          \        \"\"\"        \n\n        message = MIMEText(body, \"html\")\n\
          \        message[\"From\"] = sender_email\n        message[\"To\"] = recipient_email\n\
          \        message[\"Subject\"] = subject\n\n        with smtplib.SMTP_SSL(\"\
          smtp.gmail.com\", 465) as server:\n            server.login(sender_email,\
          \ sender_password)\n            server.sendmail(sender_email, recipient_email,\
          \ message.as_string())\n\n        print(f\"Alert email sent to {recipient_email}\"\
          , flush=True)\n\n    return (\"true\" if f1 < f1_threshold else \"false\"\
          , float(f1))\n\n"
        image: europe-west1-docker.pkg.dev/mlops-241257/mlops-build/mlops-build:1.2.0
    exec-extract-data-op:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - extract_data_op
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.7.0'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef extract_data_op(bucket_name: str, raw_data: Output[Dataset]):\n\
          \    import pandas as pd\n    from google.cloud import storage\n    import\
          \ io\n    import os\n\n    client = storage.Client()\n    bucket = client.bucket(bucket_name)\n\
          \n    # Read all valid breakdown CSV files from the bucket and collect only\
          \ files containing the BREAKS column\n    dfs = []\n    for blob in bucket.list_blobs(prefix=\"\
          data/\"):\n        if blob.name.endswith(\"_breakdowns.csv\"):\n       \
          \     df = pd.read_csv(io.BytesIO(blob.download_as_string()))\n        \
          \    if \"BREAKS\" in df.columns:\n                dfs.append(df)\n\n  \
          \  if not dfs:\n        raise RuntimeError(\"No valid CSV files found\"\
          )\n\n    # Merge all dataframes and save as raw_data.csv\n    output_path\
          \ = os.path.join(raw_data.path, \"raw_data.csv\")\n    os.makedirs(raw_data.path,\
          \ exist_ok=True)\n    pd.concat(dfs, ignore_index=True).to_csv(output_path,\
          \ index=False)\n\n"
        image: europe-west1-docker.pkg.dev/mlops-241257/mlops-build/mlops-build:1.2.0
    exec-prepare-data-op:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - prepare_data_op
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.7.0'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef prepare_data_op(raw_data: Input[Dataset], prepared_data: Output[Dataset]):\n\
          \    import pandas as pd\n    import os\n\n    # Read raw_data.csv and store\
          \ in a DataFrame\n    df = pd.read_csv(os.path.join(raw_data.path, \"raw_data.csv\"\
          ))\n\n    # Extract selected columns from each row and build the prepared\
          \ dataset\n    prepared_rows = []\n    for _, row in df.iterrows():\n  \
          \      prepared_rows.append({\n            \"job_id\": row[\"ID\"],\n  \
          \          \"priority\": row[\"Priority\"],\n            \"family_type\"\
          : row[\"Family_type\"],\n            \"overall_processing_time\": float(row[\"\
          Overall_processing_time\"]),\n            \"overall_waiting_time\": float(row[\"\
          Overall_waiting_time\"]),\n            \"tardiness\": float(row[\"Tardiness\"\
          ]),\n            \"breaks\": int(row[\"BREAKS\"]),\n        })\n\n    #\
          \ Save prepared dataset into prepared_data.csv\n    output_path = os.path.join(prepared_data.path,\
          \ \"prepared_data.csv\")\n    os.makedirs(prepared_data.path, exist_ok=True)\n\
          \    pd.DataFrame(prepared_rows).to_csv(output_path, index=False)\n\n"
        image: europe-west1-docker.pkg.dev/mlops-241257/mlops-build/mlops-build:1.2.0
    exec-trigger-new-run-op:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - trigger_new_run_op
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.7.0'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef trigger_new_run_op(project_id: str,location: str,f1_score: float,trigger_id:\
          \ str):\n\n    import subprocess\n\n    print(f\"F1 score {f1_score:.4f}\
          \ is below threshold. Triggering Cloud Build.\")\n\n    cmd = [\n      \
          \  \"gcloud\", \"builds\", \"triggers\",\n        \"run\", trigger_id,\n\
          \        \"--region\", location,\n        \"--project\", project_id,\n \
          \   ]\n\n    subprocess.run(cmd, check=True)\n    print(\"Cloud Build trigger\
          \ started successfully.\")\n\n"
        image: europe-west1-docker.pkg.dev/mlops-241257/mlops-build/mlops-build:1.2.0
pipelineInfo:
  description: Evaluate latest registered model on new labeled data and trigger retraining
    if degraded
  name: mlops-monitoring-pipeline
root:
  dag:
    tasks:
      condition-1:
        componentRef:
          name: comp-condition-1
        dependentTasks:
        - evaluate-data-op
        inputs:
          parameters:
            pipelinechannel--evaluate-data-op-f1_score:
              taskOutputParameter:
                outputParameterKey: f1_score
                producerTask: evaluate-data-op
            pipelinechannel--evaluate-data-op-retrain_decision:
              taskOutputParameter:
                outputParameterKey: retrain_decision
                producerTask: evaluate-data-op
            pipelinechannel--location:
              componentInputParameter: location
            pipelinechannel--project_id:
              componentInputParameter: project_id
            pipelinechannel--trigger_id:
              componentInputParameter: trigger_id
        taskInfo:
          name: condition-1
        triggerPolicy:
          condition: inputs.parameter_values['pipelinechannel--evaluate-data-op-retrain_decision']
            == 'true'
      evaluate-data-op:
        cachingOptions: {}
        componentRef:
          name: comp-evaluate-data-op
        dependentTasks:
        - prepare-data-op
        inputs:
          artifacts:
            prepared_data:
              taskOutputArtifact:
                outputArtifactKey: prepared_data
                producerTask: prepare-data-op
          parameters:
            bucket_name:
              componentInputParameter: bucket_name
            env:
              componentInputParameter: env
            f1_threshold:
              componentInputParameter: f1_threshold
            feature_set:
              componentInputParameter: feature_set
            project_id:
              componentInputParameter: project_id
            recipient_email:
              componentInputParameter: recipient_email
            sender_email:
              componentInputParameter: sender_email
            smtp_secret_name:
              componentInputParameter: smtp_secret_name
        taskInfo:
          name: evaluate-data-op
      extract-data-op:
        cachingOptions: {}
        componentRef:
          name: comp-extract-data-op
        inputs:
          parameters:
            bucket_name:
              componentInputParameter: bucket_name
        taskInfo:
          name: extract-data-op
      prepare-data-op:
        cachingOptions: {}
        componentRef:
          name: comp-prepare-data-op
        dependentTasks:
        - extract-data-op
        inputs:
          artifacts:
            raw_data:
              taskOutputArtifact:
                outputArtifactKey: raw_data
                producerTask: extract-data-op
        taskInfo:
          name: prepare-data-op
  inputDefinitions:
    parameters:
      bucket_name:
        parameterType: STRING
      env:
        parameterType: STRING
      f1_threshold:
        parameterType: NUMBER_DOUBLE
      feature_set:
        parameterType: STRING
      location:
        parameterType: STRING
      project_id:
        parameterType: STRING
      recipient_email:
        parameterType: STRING
      sender_email:
        parameterType: STRING
      smtp_secret_name:
        parameterType: STRING
      trigger_id:
        parameterType: STRING
schemaVersion: 2.1.0
sdkVersion: kfp-2.7.0

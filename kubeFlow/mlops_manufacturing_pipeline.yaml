# PIPELINE DEFINITION
# Name: mlops-manufacturing-pipeline
# Description: Train, evaluate and register ML model
# Inputs:
#    bucket_name: str
#    env: str
#    f1_threshold: float
#    location: str
#    model_display_name: str
#    project_id: str
#    run_id: str
# Outputs:
#    evaluate-model-op-metrics: system.Metrics
components:
  comp-condition-1:
    dag:
      tasks:
        register-model-op:
          cachingOptions:
            enableCache: true
          componentRef:
            name: comp-register-model-op
          inputs:
            artifacts:
              model:
                componentInputArtifact: pipelinechannel--train-model-op-model
            parameters:
              display_name:
                componentInputParameter: pipelinechannel--model_display_name
              location:
                componentInputParameter: pipelinechannel--location
              project_id:
                componentInputParameter: pipelinechannel--project_id
          taskInfo:
            name: register-model-op
    inputDefinitions:
      artifacts:
        pipelinechannel--train-model-op-model:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
      parameters:
        pipelinechannel--evaluate-model-op-deploy_decision:
          parameterType: STRING
        pipelinechannel--location:
          parameterType: STRING
        pipelinechannel--model_display_name:
          parameterType: STRING
        pipelinechannel--project_id:
          parameterType: STRING
  comp-evaluate-model-op:
    executorLabel: exec-evaluate-model-op
    inputDefinitions:
      artifacts:
        model:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
        prepared_data:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
      parameters:
        f1_threshold:
          defaultValue: 0.9
          isOptional: true
          parameterType: NUMBER_DOUBLE
    outputDefinitions:
      artifacts:
        metrics:
          artifactType:
            schemaTitle: system.Metrics
            schemaVersion: 0.0.1
      parameters:
        deploy_decision:
          parameterType: STRING
  comp-extract-data-op:
    executorLabel: exec-extract-data-op
    inputDefinitions:
      parameters:
        bucket_name:
          parameterType: STRING
    outputDefinitions:
      artifacts:
        raw_data:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
  comp-prepare-data-op:
    executorLabel: exec-prepare-data-op
    inputDefinitions:
      artifacts:
        raw_data:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
    outputDefinitions:
      artifacts:
        prepared_data:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
  comp-register-model-op:
    executorLabel: exec-register-model-op
    inputDefinitions:
      artifacts:
        model:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
      parameters:
        display_name:
          parameterType: STRING
        location:
          parameterType: STRING
        project_id:
          parameterType: STRING
    outputDefinitions:
      artifacts:
        model_resource:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
  comp-train-model-op:
    executorLabel: exec-train-model-op
    inputDefinitions:
      artifacts:
        prepared_data:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
      parameters:
        bucket_name:
          parameterType: STRING
    outputDefinitions:
      artifacts:
        model:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
deploymentSpec:
  executors:
    exec-evaluate-model-op:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - evaluate_model_op
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.7.0'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"'  &&\
          \  python3 -m pip install --quiet --no-warn-script-location 'pandas' 'scikit-learn'\
          \ 'joblib' && \"$0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef evaluate_model_op(\n    model: Input[Model],\n    prepared_data:\
          \ Input[Dataset],\n    metrics: Output[Metrics],\n    f1_threshold: float\
          \ = 0.9,\n) -> NamedTuple(\"Outputs\", [(\"deploy_decision\", str)]):\n\
          \    import os\n    import pandas as pd\n    import joblib\n    from sklearn.metrics\
          \ import f1_score\n\n    # Load data\n    df = pd.read_csv(os.path.join(prepared_data.path,\
          \ \"prepared_data.csv\"))\n    X = df.drop(\"breaks\", axis=1)\n    y_true\
          \ = df[\"breaks\"]\n\n    # Load model\n    clf = joblib.load(os.path.join(model.path,\
          \ \"model.joblib\"))\n\n    # Predict\n    y_pred = clf.predict(X)\n\n \
          \   # Multiclass-safe F1\n    f1 = f1_score(y_true, y_pred, average=\"weighted\"\
          )\n    metrics.log_metric(\"f1_score_weighted\", f1)\n\n    print(f\"Weighted\
          \ F1 score: {f1}\")\n    return (\"true\" if f1 >= f1_threshold else \"\
          false\",)\n\n"
        image: python:3.10
    exec-extract-data-op:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - extract_data_op
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.7.0'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"'  &&\
          \  python3 -m pip install --quiet --no-warn-script-location 'pandas' 'google-cloud-storage<3'\
          \ && \"$0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef extract_data_op(bucket_name: str, raw_data: Output[Dataset]):\n\
          \    import pandas as pd\n    from google.cloud import storage\n    import\
          \ io\n    import os\n\n    client = storage.Client()\n    bucket = client.bucket(bucket_name)\n\
          \    dfs = []\n\n    for blob in bucket.list_blobs():\n        if blob.name.endswith(\"\
          _breakdowns.csv\"):\n            df = pd.read_csv(io.BytesIO(blob.download_as_string()))\n\
          \            if \"BREAKS\" in df.columns:\n                dfs.append(df)\n\
          \n    if not dfs:\n        raise RuntimeError(\"No valid CSV files found\"\
          )\n\n    # Merge all DataFrames into a single DataFrame\n    merged_df =\
          \ pd.concat(dfs, ignore_index=True)\n    os.makedirs(raw_data.path, exist_ok=True)\n\
          \    output_path = os.path.join(raw_data.path, \"raw_data.csv\")\n    merged_df.to_csv(output_path,\
          \ index=False)\n    print(f\"Raw data written to {output_path}\")\n\n"
        image: python:3.10
    exec-prepare-data-op:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - prepare_data_op
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.7.0'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"'  &&\
          \  python3 -m pip install --quiet --no-warn-script-location 'pandas' &&\
          \ \"$0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef prepare_data_op(raw_data: Input[Dataset], prepared_data: Output[Dataset]):\n\
          \    import pandas as pd\n    import os\n\n    # 1. Load raw data\n    raw_data_path\
          \ = os.path.join(raw_data.path, \"raw_data.csv\")\n\n    # Raw file has\
          \ no header (column positions are fixed)\n    df = pd.read_csv(raw_data_path)\n\
          \n    prepared_rows = []\n\n    # 2. Row-wise feature engineering\n    for\
          \ _, row in df.iterrows():\n        first_stage  = row.iloc[3]\n       \
          \ second_stage = row.iloc[7]\n        third_stage  = row.iloc[11]\n    \
          \    fourth_stage = row.iloc[15]\n\n        prepared_rows.append({\n   \
          \         # Identifiers / metadata\n            \"job_id\": row.iloc[0],\n\
          \            \"priority\": row.iloc[1],\n\n            # First stage (SMD)\n\
          \            \"smd_0\": int(first_stage == \"SMD_0\"),\n            \"smd_1\"\
          : int(first_stage == \"SMD_1\"),\n            \"smd_2\": int(first_stage\
          \ == \"SMD_2\"),\n            \"smd_3\": int(first_stage == \"SMD_3\"),\n\
          \            \"smd_4\": int(first_stage == \"SMD_4\"),\n            \"processing_time_s1\"\
          : row.iloc[6],\n\n            # Second stage (AOI)\n            \"aoi_0\"\
          : int(second_stage == \"AOI_0\"),\n            \"aoi_1\": int(second_stage\
          \ == \"AOI_1\"),\n            \"aoi_2\": int(second_stage == \"AOI_2\"),\n\
          \            \"aoi_3\": int(second_stage == \"AOI_3\"),\n            \"\
          aoi_4\": int(second_stage == \"AOI_4\"),\n            \"processing_time_s2\"\
          : row.iloc[10],\n\n            # Third stage (SS)\n            \"ss_0\"\
          : int(third_stage == \"SS_0\"),\n            \"ss_1\": int(third_stage ==\
          \ \"SS_1\"),\n            \"ss_2\": int(third_stage == \"SS_2\"),\n    \
          \        \"ss_3\": int(third_stage == \"SS_3\"),\n            \"ss_4\":\
          \ int(third_stage == \"SS_4\"),\n            \"processing_time_s3\": row.iloc[14],\n\
          \n            # Fourth stage (CC)\n            \"cc_0\": int(fourth_stage\
          \ == \"CC_0\"),\n            \"cc_1\": int(fourth_stage == \"CC_1\"),\n\
          \            \"processing_time_s4\": row.iloc[18],\n\n            # Global\
          \ KPIs\n            \"overall_processing_time\": row.iloc[19],\n       \
          \     \"overall_waiting_time\": row.iloc[20],\n            \"tardiness\"\
          : row.iloc[21],\n\n            # -------- Target --------\n            \"\
          breaks\": row.iloc[22],\n        })\n\n    # 3. Save prepared dataset\n\
          \    prepared_df = pd.DataFrame(prepared_rows)\n    os.makedirs(prepared_data.path,\
          \ exist_ok=True)\n    output_path = os.path.join(prepared_data.path, \"\
          prepared_data.csv\")\n    prepared_df.to_csv(output_path, index=False)\n\
          \    print(\"Prepared data written to:\", output_path)\n\n"
        image: python:3.10
    exec-register-model-op:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - register_model_op
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.7.0'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"'  &&\
          \  python3 -m pip install --quiet --no-warn-script-location 'google-cloud-aiplatform'\
          \ && \"$0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef register_model_op(\n    project_id: str,\n    location: str,\n\
          \    model: Input[Model],\n    display_name: str,\n    model_resource: Output[Artifact],\n\
          ):\n    from google.cloud import aiplatform\n\n    aiplatform.init(project=project_id,\
          \ location=location)\n    print(f\"Registering model from: {model.path}\"\
          )\n    uploaded_model = aiplatform.Model.upload(\n        display_name=display_name,\n\
          \        artifact_uri=model.path,\n        serving_container_image_uri=\"\
          europe-docker.pkg.dev/vertex-ai/prediction/sklearn-cpu.1-0:latest\",\n \
          \       sync=True,\n    )\n    with open(model_resource.path, \"w\") as\
          \ f:\n        f.write(uploaded_model.resource_name)\n\n    print(\"Model\
          \ registered:\", uploaded_model.resource_name)\n\n"
        image: python:3.10
    exec-train-model-op:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - train_model_op
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.7.0'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"'  &&\
          \  python3 -m pip install --quiet --no-warn-script-location 'pandas' 'scikit-learn'\
          \ 'joblib' 'google-cloud-storage' && \"$0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef train_model_op(prepared_data: Input[Dataset], model: Output[Model],\
          \ bucket_name: str):\n    import pandas as pd\n    import joblib\n    import\
          \ os\n    from google.cloud import storage\n    from sklearn.neighbors import\
          \ KNeighborsClassifier\n\n    # Load data\n    df = pd.read_csv(os.path.join(prepared_data.path,\
          \ \"prepared_data.csv\"))\n    X = df.drop(\"breaks\", axis=1)\n    y =\
          \ df[\"breaks\"]\n\n    # Train model\n    clf = KNeighborsClassifier(n_neighbors=5,metric=\"\
          minkowski\")\n    clf.fit(X, y)\n\n    # Save model locally (Kubeflow artifact)\n\
          \    os.makedirs(model.path, exist_ok=True)\n    local_model_path = os.path.join(model.path,\
          \ \"model.joblib\")\n    joblib.dump(clf, local_model_path)\n    print(f\"\
          Model saved locally at {local_model_path}\")\n\n    # Upload model to GCS\
          \ (Python SDK)\n    client = storage.Client()\n    bucket = client.bucket(bucket_name)\n\
          \    gcs_blob_path = \"dev/model/model.joblib\"\n    blob = bucket.blob(gcs_blob_path)\n\
          \    blob.upload_from_filename(local_model_path)\n    print(f\"Model uploaded\
          \ to gs://{bucket_name}/{gcs_blob_path}\")\n\n"
        image: python:3.10
pipelineInfo:
  description: Train, evaluate and register ML model
  name: mlops-manufacturing-pipeline
root:
  dag:
    outputs:
      artifacts:
        evaluate-model-op-metrics:
          artifactSelectors:
          - outputArtifactKey: metrics
            producerSubtask: evaluate-model-op
    tasks:
      condition-1:
        componentRef:
          name: comp-condition-1
        dependentTasks:
        - evaluate-model-op
        - train-model-op
        inputs:
          artifacts:
            pipelinechannel--train-model-op-model:
              taskOutputArtifact:
                outputArtifactKey: model
                producerTask: train-model-op
          parameters:
            pipelinechannel--evaluate-model-op-deploy_decision:
              taskOutputParameter:
                outputParameterKey: deploy_decision
                producerTask: evaluate-model-op
            pipelinechannel--location:
              componentInputParameter: location
            pipelinechannel--model_display_name:
              componentInputParameter: model_display_name
            pipelinechannel--project_id:
              componentInputParameter: project_id
        taskInfo:
          name: condition-1
        triggerPolicy:
          condition: inputs.parameter_values['pipelinechannel--evaluate-model-op-deploy_decision']
            == 'true'
      evaluate-model-op:
        cachingOptions: {}
        componentRef:
          name: comp-evaluate-model-op
        dependentTasks:
        - prepare-data-op
        - train-model-op
        inputs:
          artifacts:
            model:
              taskOutputArtifact:
                outputArtifactKey: model
                producerTask: train-model-op
            prepared_data:
              taskOutputArtifact:
                outputArtifactKey: prepared_data
                producerTask: prepare-data-op
          parameters:
            f1_threshold:
              componentInputParameter: f1_threshold
        taskInfo:
          name: evaluate-model-op
      extract-data-op:
        cachingOptions: {}
        componentRef:
          name: comp-extract-data-op
        inputs:
          parameters:
            bucket_name:
              componentInputParameter: bucket_name
        taskInfo:
          name: extract-data-op
      prepare-data-op:
        cachingOptions: {}
        componentRef:
          name: comp-prepare-data-op
        dependentTasks:
        - extract-data-op
        inputs:
          artifacts:
            raw_data:
              taskOutputArtifact:
                outputArtifactKey: raw_data
                producerTask: extract-data-op
        taskInfo:
          name: prepare-data-op
      train-model-op:
        cachingOptions: {}
        componentRef:
          name: comp-train-model-op
        dependentTasks:
        - prepare-data-op
        inputs:
          artifacts:
            prepared_data:
              taskOutputArtifact:
                outputArtifactKey: prepared_data
                producerTask: prepare-data-op
          parameters:
            bucket_name:
              componentInputParameter: bucket_name
        taskInfo:
          name: train-model-op
  inputDefinitions:
    parameters:
      bucket_name:
        parameterType: STRING
      env:
        parameterType: STRING
      f1_threshold:
        parameterType: NUMBER_DOUBLE
      location:
        parameterType: STRING
      model_display_name:
        parameterType: STRING
      project_id:
        parameterType: STRING
      run_id:
        parameterType: STRING
  outputDefinitions:
    artifacts:
      evaluate-model-op-metrics:
        artifactType:
          schemaTitle: system.Metrics
          schemaVersion: 0.0.1
schemaVersion: 2.1.0
sdkVersion: kfp-2.7.0

options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _REGION: europe-west3

steps:
# 1. Install dependencies
- name: python:3.10
  id: Install dependencies
  entrypoint: bash
  args:
    - -c
    - |
      pip install --upgrade pip
      pip install -r requirements.txt

# 2. Compile pipeline
- name: python:3.10
  id: Compile pipeline
  entrypoint: bash
  args:
    - -c
    - |
      python kubeFlow/compile_pipeline.py

# 3. Submit pipeline (branch-based)
- name: python:3.10
  id: Submit pipeline
  entrypoint: bash
  args:
    - -c
    - |
      echo "Branch name: $BRANCH_NAME"

      if [ "$BRANCH_NAME" = "develop" ]; then
        echo "Running DEV pipeline submission"
        python submit_dev.py

      elif [ "$BRANCH_NAME" = "prod" ] || [ "$BRANCH_NAME" = "main" ]; then
        echo "Running PROD pipeline submission"
        python submit_prod.py

      else
        echo "No pipeline submission for branch: $BRANCH_NAME"
      fi

options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _PROJECT_ID: mlops-pipeline-01
  _ARTIFACT_REPO: mlops-images
  _ARTIFACT_HOST: europe-west3-docker.pkg.dev

steps:
  # 1. Compile pipeline
  - name: '${_ARTIFACT_HOST}/${_PROJECT_ID}/mlops-build/mlops-build:1.0.1'
    id: Compile pipeline
    entrypoint: python
    args:
      - kubeFlow/compile_pipeline.py

  # 2. Submit pipeline (branch-based)
  - name: '${_ARTIFACT_HOST}/${_PROJECT_ID}/mlops-build/mlops-build:1.0.1'
    id: Submit pipeline
    entrypoint: bash
    args:
      - -c
      - |
        if [ "$BRANCH_NAME" = "prod" ]; then ENV=prod; else ENV=dev; fi
        python kubeFlow/submit.py

  # 3. Build Streamlit image
  - name: 'gcr.io/cloud-builders/docker'
    id: Build image
    args:
      - build
      - -t
      - ${_ARTIFACT_HOST}/${_PROJECT_ID}/${_ARTIFACT_REPO}/mlops-streamlit:$BUILD_ID
      - .

  # 4. Push image
  - name: 'gcr.io/cloud-builders/docker'
    id: Push image
    args:
      - push
      - ${_ARTIFACT_HOST}/${_PROJECT_ID}/${_ARTIFACT_REPO}/mlops-streamlit:$BUILD_ID

  # 5. Deploy to GKE
  - name: 'gcr.io/cloud-builders/gke-deploy'
    id: Deploy to GKE
    args:
      - run
      - --filename=k8s/
      - --image=${_ARTIFACT_HOST}/${_PROJECT_ID}/${_ARTIFACT_REPO}/mlops-streamlit:$BUILD_ID
      - --cluster=mlops-cluster
      - --location=europe-west3-b
      - --namespace=default

images:
  - ${_ARTIFACT_HOST}/${_PROJECT_ID}/${_ARTIFACT_REPO}/mlops-streamlit:$BUILD_ID

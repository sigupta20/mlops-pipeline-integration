apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlops-streamlit
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mlops-streamlit
  template:
    metadata:
      labels:
        app: mlops-streamlit
    spec:
      serviceAccountName: mlops-ksa
      containers:
        - name: streamlit
          image: europe-west1-docker.pkg.dev/mlops-241257/mlops-images/mlops-streamlit
          ports:
            - containerPort: 8080
          env:
            - name: MODEL_BUCKET
              value: "mlops-241257"
            - name: MODEL_GCS_PATH
              value: "artifacts/prod/latest/model.joblib"

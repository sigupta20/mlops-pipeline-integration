# PIPELINE DEFINITION
# Name: mlops-manufacturing-dev
# Inputs:
#    bucket_name: str
#    f1_threshold: float [Default: 0.85]
#    location: str
#    model_display_name: str
#    project_id: str
components:
  comp-condition-1:
    dag:
      tasks:
        register-model-op:
          cachingOptions:
            enableCache: true
          componentRef:
            name: comp-register-model-op
          inputs:
            artifacts:
              model:
                componentInputArtifact: pipelinechannel--train-knn-op-model
            parameters:
              display_name:
                componentInputParameter: pipelinechannel--model_display_name
              location:
                componentInputParameter: pipelinechannel--location
              project_id:
                componentInputParameter: pipelinechannel--project_id
          taskInfo:
            name: register-model-op
    inputDefinitions:
      artifacts:
        pipelinechannel--train-knn-op-model:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
      parameters:
        pipelinechannel--evaluate-model-op-deploy_decision:
          parameterType: STRING
        pipelinechannel--location:
          parameterType: STRING
        pipelinechannel--model_display_name:
          parameterType: STRING
        pipelinechannel--project_id:
          parameterType: STRING
  comp-evaluate-model-op:
    executorLabel: exec-evaluate-model-op
    inputDefinitions:
      artifacts:
        model:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
        prepared_data:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
      parameters:
        f1_threshold:
          defaultValue: 0.85
          isOptional: true
          parameterType: NUMBER_DOUBLE
    outputDefinitions:
      artifacts:
        metrics:
          artifactType:
            schemaTitle: system.Metrics
            schemaVersion: 0.0.1
      parameters:
        deploy_decision:
          parameterType: STRING
  comp-extract-data-op:
    executorLabel: exec-extract-data-op
    inputDefinitions:
      parameters:
        bucket_name:
          parameterType: STRING
    outputDefinitions:
      artifacts:
        raw_data:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
  comp-prepare-data-op:
    executorLabel: exec-prepare-data-op
    inputDefinitions:
      artifacts:
        raw_data:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
    outputDefinitions:
      artifacts:
        prepared_data:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
  comp-register-model-op:
    executorLabel: exec-register-model-op
    inputDefinitions:
      artifacts:
        model:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
      parameters:
        display_name:
          parameterType: STRING
        location:
          parameterType: STRING
        project_id:
          parameterType: STRING
  comp-train-knn-op:
    executorLabel: exec-train-knn-op
    inputDefinitions:
      artifacts:
        prepared_data:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
    outputDefinitions:
      artifacts:
        model:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
deploymentSpec:
  executors:
    exec-evaluate-model-op:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - evaluate_model_op
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'pandas' 'scikit-learn'\
          \ 'joblib'  &&  python3 -m pip install --quiet --no-warn-script-location\
          \ 'kfp==2.15.2' '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"\
          3.9\"' && \"$0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef evaluate_model_op(\n    model: Input[Model],\n    prepared_data:\
          \ Input[Dataset],\n    metrics: Output[Metrics],\n    f1_threshold: float\
          \ = 0.85,\n) -> NamedTuple(\"Outputs\", [(\"deploy_decision\", str)]):\n\
          \n    import pandas as pd, joblib\n    from sklearn.metrics import f1_score\n\
          \n    df = pd.read_csv(f\"{prepared_data.path}/prepared_data.csv\")\n  \
          \  X, y = df.drop(\"breaks\", axis=1), df[\"breaks\"]\n\n    clf = joblib.load(f\"\
          {model.path}/model.joblib\")\n    preds = clf.predict(X)\n\n    f1 = f1_score(y,\
          \ preds, average=\"weighted\")\n    metrics.log_metric(\"f1_weighted\",\
          \ f1)\n\n    return (\"true\" if f1 >= f1_threshold else \"false\",)\n\n"
        image: python:3.10
    exec-extract-data-op:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - extract_data_op
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'pandas' 'google-cloud-storage<3'\
          \  &&  python3 -m pip install --quiet --no-warn-script-location 'kfp==2.15.2'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef extract_data_op(bucket_name: str, raw_data: Output[Dataset]):\n\
          \    import pandas as pd\n    from google.cloud import storage\n    import\
          \ io, os\n\n    client = storage.Client()\n    bucket = client.bucket(BUCKET_NAME)\n\
          \    dfs = []\n\n    for blob in bucket.list_blobs():\n        if blob.name.endswith(\"\
          _breakdowns.csv\"):\n            df = pd.read_csv(io.BytesIO(blob.download_as_string()))\n\
          \            if \"BREAKS\" in df.columns:\n                dfs.append(df)\n\
          \n    if not dfs:\n        raise RuntimeError(\"No valid CSV files found\"\
          )\n\n    merged = pd.concat(dfs, ignore_index=True)\n    os.makedirs(raw_data.path,\
          \ exist_ok=True)\n    merged.to_csv(f\"{raw_data.path}/raw_data.csv\", index=False)\n\
          \    print(f\"Raw data written to {output_path}\")\n\n"
        image: python:3.10
    exec-prepare-data-op:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - prepare_data_op
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'pandas'  &&\
          \  python3 -m pip install --quiet --no-warn-script-location 'kfp==2.15.2'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef prepare_data_op(raw_data: Input[Dataset], prepared_data: Output[Dataset]):\n\
          \    import pandas as pd, os\n    df = pd.read_csv(f\"{raw_data.path}/raw_data.csv\"\
          )\n    rows = []\n    for _, r in df.iterrows():\n        rows.append({\n\
          \            \"job_id\": r.iloc[0],\n            \"priority\": r.iloc[1],\n\
          \            \"processing_time\": r.iloc[19],\n            \"breaks\": r.iloc[22],\n\
          \        })\n\n    out = pd.DataFrame(rows)\n    os.makedirs(prepared_data.path,\
          \ exist_ok=True)\n    out.to_csv(f\"{prepared_data.path}/prepared_data.csv\"\
          , index=False)\n\n"
        image: python:3.10
    exec-register-model-op:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - register_model_op
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'google-cloud-aiplatform'\
          \  &&  python3 -m pip install --quiet --no-warn-script-location 'kfp==2.15.2'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef register_model_op(\n    project_id: str,\n    location: str,\n\
          \    model: Input[Model],\n    display_name: str,\n):\n    from google.cloud\
          \ import aiplatform\n    aiplatform.init(project=project_id, location=location)\n\
          \n    aiplatform.Model.upload(\n        display_name=display_name,\n   \
          \     artifact_uri=model.path,\n        serving_container_image_uri=\"europe-docker.pkg.dev/vertex-ai/prediction/sklearn-cpu.1-0:latest\"\
          ,\n        sync=True,\n    )\n\n"
        image: python:3.10
    exec-train-knn-op:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - train_knn_op
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'pandas' 'scikit-learn'\
          \ 'joblib'  &&  python3 -m pip install --quiet --no-warn-script-location\
          \ 'kfp==2.15.2' '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"\
          3.9\"' && \"$0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef train_knn_op(prepared_data: Input[Dataset], model: Output[Model]):\n\
          \    import pandas as pd, joblib, os\n    from sklearn.neighbors import\
          \ KNeighborsClassifier\n\n    df = pd.read_csv(f\"{prepared_data.path}/prepared_data.csv\"\
          )\n    X, y = df.drop(\"breaks\", axis=1), df[\"breaks\"]\n\n    clf = KNeighborsClassifier(n_neighbors=5,metric=\"\
          minkowski\")\n    clf.fit(X, y)\n\n    os.makedirs(model.path, exist_ok=True)\n\
          \    joblib.dump(clf, f\"{model.path}/model.joblib\")\n    print(\"Model\
          \ training completed\")\n    print(f\"Model saved to: {model_path}\")\n\n"
        image: python:3.10
pipelineInfo:
  name: mlops-manufacturing-dev
root:
  dag:
    tasks:
      condition-1:
        componentRef:
          name: comp-condition-1
        dependentTasks:
        - evaluate-model-op
        - train-knn-op
        inputs:
          artifacts:
            pipelinechannel--train-knn-op-model:
              taskOutputArtifact:
                outputArtifactKey: model
                producerTask: train-knn-op
          parameters:
            pipelinechannel--evaluate-model-op-deploy_decision:
              taskOutputParameter:
                outputParameterKey: deploy_decision
                producerTask: evaluate-model-op
            pipelinechannel--location:
              componentInputParameter: location
            pipelinechannel--model_display_name:
              componentInputParameter: model_display_name
            pipelinechannel--project_id:
              componentInputParameter: project_id
        taskInfo:
          name: condition-1
        triggerPolicy:
          condition: inputs.parameter_values['pipelinechannel--evaluate-model-op-deploy_decision']
            == 'true'
      evaluate-model-op:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-evaluate-model-op
        dependentTasks:
        - prepare-data-op
        - train-knn-op
        inputs:
          artifacts:
            model:
              taskOutputArtifact:
                outputArtifactKey: model
                producerTask: train-knn-op
            prepared_data:
              taskOutputArtifact:
                outputArtifactKey: prepared_data
                producerTask: prepare-data-op
          parameters:
            f1_threshold:
              componentInputParameter: f1_threshold
        taskInfo:
          name: evaluate-model-op
      extract-data-op:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-extract-data-op
        inputs:
          parameters:
            bucket_name:
              runtimeValue:
                constant: mlops-pipeline-01
        taskInfo:
          name: extract-data-op
      prepare-data-op:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-prepare-data-op
        dependentTasks:
        - extract-data-op
        inputs:
          artifacts:
            raw_data:
              taskOutputArtifact:
                outputArtifactKey: raw_data
                producerTask: extract-data-op
        taskInfo:
          name: prepare-data-op
      train-knn-op:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-train-knn-op
        dependentTasks:
        - prepare-data-op
        inputs:
          artifacts:
            prepared_data:
              taskOutputArtifact:
                outputArtifactKey: prepared_data
                producerTask: prepare-data-op
        taskInfo:
          name: train-knn-op
  inputDefinitions:
    parameters:
      bucket_name:
        parameterType: STRING
      f1_threshold:
        defaultValue: 0.85
        isOptional: true
        parameterType: NUMBER_DOUBLE
      location:
        parameterType: STRING
      model_display_name:
        parameterType: STRING
      project_id:
        parameterType: STRING
schemaVersion: 2.1.0
sdkVersion: kfp-2.15.2
